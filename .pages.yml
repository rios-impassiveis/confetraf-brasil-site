media:
  input: public
  output: /

content:
  - name: posts
    label: Notícias
    type: collection
    path: src/content/blog
    filename: "{primary}.md"

    view:
      fields: [title, draft, pubDatetime]
      primary: title
      sort: pubDatetime
      default:
        sort: pubDatetime
        order: desc

    fields:
      - name: author
        label: Autor
        type: string

      - name: pubDatetime
        label: Data de publicação
        type: date
        required: true

      - name: modDatetime
        label: Data de atualização
        type: date

      - name: title
        label: Título
        type: string
        required: true

      - name: ogImage
        label: Imagem de destaque
        type: string

      - name: slug
        label: Slug
        type: string

      - name: featured
        label: Destaque
        type: boolean

      - name: draft
        label: Rascunho
        type: boolean

      - name: tags
        label: Tags
        type: string
        list: true

      - name: description
        label: Resumo
        type: string
        required: true

      - name: body
        label: Conteúdo
        type: rich-text

  - name: documents
    label: Documentos
    type: collection
    path: src/content/documents
    filename: "{primary}.md"

    view:
      fields: [title, category, date]
      primary: title
      sort: date
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Título
        type: string
        required: true

      - name: category
        label: Categoria
        type: select
        options:
          - Estatuto
          - Atas
          - Editais
          - Resoluções
          - Cartilhas
          - Outros
        required: true

      - name: date
        label: Data
        type: date
        required: true

      - name: description
        label: Descrição
        type: string
        required: true

      - name: file
        label: Arquivo (PDF)
        type: file
        required: true
        options:
          input: public/documents
          output: /documents

  - name: confederacao
    label: A Confederação
    type: file
    path: src/pages/confederacao.md

    fields:
      - name: layout
        type: string
        hidden: true
        default: "../layouts/InstitutionalLayout.astro"

      - name: activeNav
        type: string
        hidden: true
        default: "confederacao"

      - name: title
        label: Título
        type: string
        required: true

      - name: description
        label: Resumo (SEO)
        type: string

      - name: body
        label: Conteúdo
        type: rich-text
        options:
          input: public/assets
          output: /assets

  - name: organizacao
    label: Organização
    type: file
    path: src/pages/organizacao.md

    fields:
      - name: layout
        type: string
        hidden: true
        default: "../layouts/InstitutionalLayout.astro"

      - name: activeNav
        type: string
        hidden: true
        default: "organizacao"

      - name: title
        label: Título
        type: string
        required: true

      - name: description
        label: Resumo (SEO)
        type: string

      - name: body
        label: Conteúdo
        type: rich-text
        options:
          input: public/assets
          output: /assets

  - name: contato
    label: Contato
    type: file
    path: src/pages/contato.md

    fields:
      - name: layout
        type: string
        hidden: true
        default: "../layouts/InstitutionalLayout.astro"

      - name: activeNav
        type: string
        hidden: true
        default: "contato"

      - name: title
        label: Título
        type: string
        required: true

      - name: description
        label: Resumo (SEO)
        type: string

      - name: body
        label: Conteúdo
        type: rich-text
        options:
          input: public/assets
          output: /assets
